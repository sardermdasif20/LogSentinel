[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "logsentinel"
version = "0.1.0"
description = "Security Log Analysis & Threat Detection Platform"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    {name = "MD ASIF SARDER"}
]
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]