[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "logsentinel"
version = "0.1.0"
description = "Security Log Analysis & Threat Detection Platform"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    {name = "MD ASIF SARDER"}
]
dependencies = []

[project.optional-dependencies]
dashboard = ["streamlit>=1.40"]
dev = ["pytest>=9.0", "ruff>=0.17"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]


[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"